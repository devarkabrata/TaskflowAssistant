<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TaskFlow Assistant — Test UI</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #6155dd;
    --user-bubble: #2a2f3a;
    --ai-bubble: #1e2230;
    --tool: #b98900;
    --error: #e5484d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }

  .config {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .config label {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 3px;
  }

  .config input,
  .config select {
    width: 100%;
    padding: 7px 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-family: ui-monospace, monospace;
  }

  .config-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
  }

  .msg.system {
    align-self: center;
    max-width: 90%;
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, monospace;
  }

  .msg.tool {
    align-self: flex-start;
    max-width: 90%;
    font-size: 12px;
    font-family: ui-monospace, monospace;
    color: var(--tool);
    border: 1px dashed var(--tool);
    background: transparent;
  }

  .msg.reasoning {
    align-self: flex-start;
    max-width: 90%;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
    background: transparent;
  }

  .msg.thinking {
    align-self: flex-start;
    max-width: 90%;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
    background: transparent;
    animation: thinking-pulse 1.4s ease-in-out infinite;
  }

  @keyframes thinking-pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  .msg.error {
    align-self: center;
    max-width: 90%;
    color: var(--error);
    border: 1px solid var(--error);
    font-size: 13px;
  }

  .msg.stopped {
    align-self: center;
    max-width: 90%;
    color: var(--muted);
    border: 1px dashed var(--muted);
    font-size: 13px;
    font-family: ui-monospace, monospace;
  }

  .msg.file {
    align-self: flex-start;
    max-width: 90%;
    font-size: 13px;
    border: 1px solid var(--accent);
    background: transparent;
  }

  .msg.file a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }

  .msg.file a:hover {
    text-decoration: underline;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  #messageInput {
    flex: 1;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }

  button {
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  #stopBtn {
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
  }
</style>
</head>
<body>

<header>
  <h1>TaskFlow Assistant — SSE Test UI</h1>
</header>

<div class="config">
  <div>
    <label for="apiUrl">API endpoint</label>
    <input id="apiUrl" value="http://127.0.0.1:8000/chat" />
  </div>
  <div>
    <label for="tokenInput">TaskFlow bearer token (paste manually — sent as Authorization: Bearer &lt;token&gt;)</label>
    <input id="tokenInput" placeholder="eyJhbGciOi..." />
  </div>
  <div class="config-row">
    <div>
      <label for="threadIdInput">thread_id</label>
      <input id="threadIdInput" />
    </div>
    <div>
      <label for="thinkingLevelInput">thinking_level (whichever specialist handles this turn — not the supervisor or summarizer; leave blank for Gemini's default)</label>
      <select id="thinkingLevelInput">
        <option value="">(default)</option>
        <option value="minimal">minimal</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
      </select>
    </div>
  </div>
</div>

<div id="log"></div>

<form id="chatForm">
  <input id="messageInput" placeholder="Type a message..." autocomplete="off" />
  <button id="sendBtn" type="submit">Send</button>
  <button id="stopBtn" type="button" disabled>Stop</button>
</form>

<script>
  const logEl = document.getElementById("log");
  const form = document.getElementById("chatForm");
  const messageInput = document.getElementById("messageInput");
  const apiUrlInput = document.getElementById("apiUrl");
  const tokenInput = document.getElementById("tokenInput");
  const threadIdInput = document.getElementById("threadIdInput");
  const thinkingLevelInput = document.getElementById("thinkingLevelInput");
  const sendBtn = document.getElementById("sendBtn");
  const stopBtn = document.getElementById("stopBtn");

  // Set once a job starts, cleared once it settles — lets the Stop button
  // (POST /chat/{job_id}/stop) target whichever job is currently running.
  let currentJobId = null;

  // Give every page load a fresh default thread_id, editable if you want to
  // resume/continue a specific earlier conversation.
  threadIdInput.value = crypto.randomUUID();

  function addMessage(kind, text) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
    return el;
  }

  const POLL_INTERVAL_MS = 2000;

  // Every step of a multi-tool-call turn requires a fresh round trip (a
  // model call, or a call out to the TaskFlow backend) that produces no
  // visible event until it finishes — without something here, those gaps
  // just look like the request hung. This single indicator element is kept
  // pinned to the bottom of the log (re-appending an element already in the
  // DOM moves it) and its text kept up to date with whatever's currently
  // in flight, so there's always a "we're still working on it" cue between
  // one tool result and whatever comes next — another tool call, or the
  // final answer.
  let thinkingEl = null;

  function showThinking(text) {
    if (!thinkingEl) {
      thinkingEl = document.createElement("div");
      thinkingEl.className = "msg thinking";
    }
    thinkingEl.textContent = text;
    logEl.appendChild(thinkingEl);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function hideThinking() {
    if (thinkingEl) {
      thinkingEl.remove();
      thinkingEl = null;
    }
  }

  function applyEvent(event, bubbleState, apiUrl) {
    if (event.type === "token") {
      // The real answer has started arriving — the placeholder's job is done.
      hideThinking();
      if (!bubbleState.aiBubble) bubbleState.aiBubble = addMessage("ai", "");
      bubbleState.aiText += event.content;
      bubbleState.aiBubble.textContent = bubbleState.aiText;
      logEl.scrollTop = logEl.scrollHeight;
    } else if (event.type === "reasoning") {
      // Muted, never mistaken for the actual answer (and never merges into
      // the answer bubble above). The agent is a supervisor + domain
      // specialists (agent/flow_nodes/supervisor.py) — this is a
      // specialist "thinking out loud" on a step that goes on to call a
      // tool (including an explicit handoff to another domain, see
      // agent/handoff_tools.py — a specialist that calls NO tool at all is
      // always the turn's final answer, so it's never classified as
      // "reasoning").
      addMessage("reasoning", "💭 " + event.content);
      showThinking("⏳ Continuing…");
    } else if (event.type === "tool_call" && event.tool.startsWith("handoff_to_")) {
      // agent/handoff_tools.py — a specialist explicitly passing the rest
      // of the request to a different domain, not a real backend action.
      const targetDomain = event.tool.slice("handoff_to_".length);
      addMessage("tool", "🔀 Handing off to " + targetDomain + ": " + (event.args.reason || ""));
      showThinking("⏳ Handing off to " + targetDomain + "…");
    } else if (event.type === "tool_result" && event.tool.startsWith("handoff_to_")) {
      // The matching tool_result is just an echo of the reason above (see
      // handoff_to_X's own implementation) — nothing new to show.
    } else if (event.type === "tool_call") {
      addMessage("tool", "🔧 calling " + event.tool + "(" + JSON.stringify(event.args) + ")");
      showThinking("⏳ Calling " + event.tool + "…");
    } else if (event.type === "tool_result") {
      addMessage("tool", "↩ " + event.tool + " -> " + event.output);
      showThinking("🧠 Reviewing what " + event.tool + " returned…");
    } else if (event.type === "file") {
      // export_document produced a downloadable file — GET {url} serves it
      // and deletes it from disk afterward (see dedicated_tools/store.py),
      // so this link is one-time use; a plain <a> triggers a real
      // navigation/download, which is what actually fires that delete.
      hideThinking();
      const fileEl = addMessage("file", "");
      const origin = new URL(apiUrl, window.location.href).origin;
      const link = document.createElement("a");
      link.href = origin + event.url;
      link.textContent = "⬇ Download " + event.filename;
      link.target = "_blank";
      link.rel = "noopener";
      fileEl.appendChild(link);
    } else if (event.type === "stopped") {
      hideThinking();
      addMessage("stopped", "⏹ " + event.message);
    } else if (event.type === "error") {
      hideThinking();
      addMessage("error", event.message);
    }
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const message = messageInput.value.trim();
    const token = tokenInput.value.trim();
    const threadId = threadIdInput.value.trim();
    const apiUrl = apiUrlInput.value.trim();
    const thinkingLevel = thinkingLevelInput.value;

    if (!message) return;
    if (!token) {
      addMessage("error", "Paste a TaskFlow bearer token first.");
      return;
    }

    addMessage("user", message);
    messageInput.value = "";
    sendBtn.disabled = true;
    showThinking("🤔 Thinking…");

    // The final AI answer streams in token by token — accumulate it into
    // one growing bubble instead of creating a new one per token.
    const bubbleState = { aiBubble: null, aiText: "" };

    try {
      // POST /chat kicks off the agent in the background and returns a
      // job_id almost instantly — it does NOT hold this connection open for
      // the whole agent run (a Cloudflare proxy in front of the API kills
      // any single connection that goes quiet for ~100s, which a slow
      // multi-tool-call turn can exceed). We poll GET /chat/{job_id} for
      // progress instead.
      const startResponse = await fetch(apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({
          message,
          thread_id: threadId,
          // Only sent when the dropdown isn't left on "(default)" — omitting
          // it lets Gemini's own default thinking behavior apply, matching
          // ChatRequest.thinking_level being optional (main.py).
          ...(thinkingLevel ? { thinking_level: thinkingLevel } : {}),
        }),
      });

      if (!startResponse.ok) {
        hideThinking();
        const body = await startResponse.text();
        addMessage("error", "HTTP " + startResponse.status + ": " + body);
        return;
      }

      const { job_id: jobId } = await startResponse.json();
      const statusUrl = apiUrl.replace(/\/$/, "") + "/" + jobId;
      currentJobId = jobId;
      stopBtn.disabled = false;

      let renderedCount = 0;
      while (true) {
        const pollResponse = await fetch(statusUrl);
        if (!pollResponse.ok) {
          hideThinking();
          const body = await pollResponse.text();
          addMessage("error", "HTTP " + pollResponse.status + ": " + body);
          break;
        }

        const { status, events } = await pollResponse.json();

        for (; renderedCount < events.length; renderedCount++) {
          applyEvent(events[renderedCount], bubbleState, apiUrl);
        }

        if (status !== "running") break;
        await sleep(POLL_INTERVAL_MS);
      }
    } catch (err) {
      hideThinking();
      addMessage("error", String(err));
    } finally {
      // Safety net: if the job finished without ever emitting a "token"
      // (the normal way the indicator gets cleared), don't leave it
      // spinning forever.
      hideThinking();
      sendBtn.disabled = false;
      stopBtn.disabled = true;
      currentJobId = null;
    }
  });

  stopBtn.addEventListener("click", async () => {
    if (!currentJobId) return;
    const apiUrl = apiUrlInput.value.trim();
    const stopUrl = apiUrl.replace(/\/$/, "") + "/" + currentJobId + "/stop";
    stopBtn.disabled = true;
    try {
      // The polling loop above picks up the resulting "stopped" event (and
      // the job's "cancelled" status) on its next poll — no need to do
      // anything else here.
      await fetch(stopUrl, { method: "POST" });
    } catch (err) {
      addMessage("error", "Failed to stop: " + String(err));
      stopBtn.disabled = false;
    }
  });
</script>

</body>
</html>
