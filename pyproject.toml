[project]
name = "taskflowassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devarkabrata", email = "arkabrata.chandra@codeclouds.co.in" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "mcp>=1.29.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
taskflow-agent = "taskflowassistant.main:run"
taskflow-mcp-server = "taskflowassistant.mcp.server:main"
taskflow-ingest = "taskflowassistant.rag.ingest:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
